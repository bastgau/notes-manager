name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the package version is derived from them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      # Fails when uv.lock is out of date with pyproject.toml.
      - run: uv lock --check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: |
            VERSION=9.9.9
            GIT_COMMIT=abc1234
          tags: notes-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The release workflow passes these two build arguments; /version reports them.
      - name: The version and the commit of the build are inside the image
        run: |
          test "$(docker run --rm notes-manager:ci python -c 'import notes_manager; print(notes_manager.__version__)')" = "9.9.9"
          test "$(docker run --rm notes-manager:ci printenv NOTES_MANAGER_COMMIT)" = "abc1234"

      - name: The image starts as uid 10001 and git and ssh are available
        run: |
          test "$(docker run --rm notes-manager:ci id -u)" = "10001"
          docker run --rm notes-manager:ci git --version
          docker run --rm notes-manager:ci ssh -V

      # ssh looks the current user up in /etc/passwd and exits when it is missing.
      - name: ssh runs as the runtime user
        run: docker run --rm --user 10001:10001 notes-manager:ci ssh -G github.com > /dev/null

      - name: ssh does not run for a uid without a passwd entry (why the uid is fixed)
        run: |
          if docker run --rm --user 12345:12345 notes-manager:ci ssh -G github.com > /dev/null 2>&1; then
            echo "ssh works for an unknown uid: the fixed uid is no longer needed"
            exit 1
          fi

      # git and ssh leave orphans; without an init as process 1 they pile up as zombies until
      # the container hits its process limit.
      - name: An init collects orphaned processes
        run: |
          cat > /tmp/reap.py <<'PY'
          import os, time
          child = os.fork()
          if child == 0:
              if os.fork() == 0:
                  time.sleep(0.3)
                  os._exit(0)
              os._exit(0)
          os.waitpid(child, 0)
          time.sleep(1.0)
          zombies = 0
          for pid in filter(str.isdigit, os.listdir("/proc")):
              try:
                  zombies += "\nState:\tZ" in open(f"/proc/{pid}/status").read()
              except OSError:
                  pass
          print("zombies:", zombies)
          raise SystemExit(1 if zombies else 0)
          PY
          docker run --rm notes-manager:ci tini --version
          docker run -i --rm notes-manager:ci python - < /tmp/reap.py

      - name: Without an init the same orphan stays a zombie (why tini is the entry point)
        run: |
          if docker run -i --rm --entrypoint python notes-manager:ci - < /tmp/reap.py; then
            echo "no zombie without an init: tini may no longer be needed"
            exit 1
          fi
