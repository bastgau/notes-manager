name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the package version is derived from them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      # Fails when uv.lock is out of date with pyproject.toml.
      - run: uv lock --check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: notes-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image starts as uid 10001 and git and ssh are available
        run: |
          test "$(docker run --rm notes-manager:ci id -u)" = "10001"
          docker run --rm notes-manager:ci git --version
          docker run --rm notes-manager:ci ssh -V

      # ssh looks the current user up in /etc/passwd and exits when it is missing.
      - name: ssh runs as the runtime user
        run: docker run --rm --user 10001:10001 notes-manager:ci ssh -G github.com > /dev/null

      - name: ssh does not run for a uid without a passwd entry (why the uid is fixed)
        run: |
          if docker run --rm --user 12345:12345 notes-manager:ci ssh -G github.com > /dev/null 2>&1; then
            echo "ssh works for an unknown uid: the fixed uid is no longer needed"
            exit 1
          fi
